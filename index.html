/* v0.2: readable decisions, clear progress, and a searchable character roster. */
:root {
  --muted: #657160;
  --positive: #315e3d;
  --negative: #8b5930;
  --focus: #a57833;
}
body { font-size: 14px; }
button, input, select { touch-action: manipulation; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline-color: var(--focus);
}
button:disabled { opacity: .55; }
.btn, .btn.tiny, .filter-tab, .text-btn, .close-btn, .top-avatar { min-height: 44px; }
.btn { font-size: 13px; }
.btn.tiny { font-size: 12px; padding: 9px 12px; }
.text-btn { font-size: 12px; padding: 9px 2px; }
.text-btn .icon { width: 15px; height: 15px; }
.close-btn, .top-avatar { width: 44px; min-width: 44px; }
.close-btn .icon { width: 18px; height: 18px; }
.filter-tab { font-size: 12px; }
.small, .badge { font-size: 12px; }
.badge { padding: 4px 8px; white-space: normal; line-height: 1.5; }
.eyebrow { font-size: 10px; }
.card, .layout > *, .stack > *, .flex > *, .between > * { min-width: 0; }
.page-heading p, .hero p, .story-description, .choice strong, .rule-section p {
  font-size: 13px;
}
.page-heading p { line-height: 1.8; }
.hero p { color: #d4dfce; }
.metric-label, .metric-note { font-size: 11px; color: var(--muted); }
.metric-label .icon { color: #6e8664; }
.metric-note { line-height: 1.7; }
.choice { min-height: 88px; padding: 15px; }
.choice-copy { min-width: 0; }
.choice strong { line-height: 1.7; font-weight: 600; }
.choice p { font-size: 12px; line-height: 1.8; }
.choice-number { width: 31px; height: 31px; font-size: 12px; }
.choice-effects { margin-top: 8px; gap: 6px; }
.effect { font-size: 11px; padding: 3px 7px; color: var(--positive); background: #eaf3e5; }
.effect.negative { color: var(--negative); background: #fcf1e2; }
.choice:disabled:not(.selected) { opacity: .72; }
.choice.selected { box-shadow: inset 3px 0 0 var(--green); }
.action { min-height: 103px; padding: 15px 12px; position: relative; }
.action h3 { font-size: 13px; line-height: 1.7; }
.action p, .action-cost { font-size: 11px; line-height: 1.7; color: var(--muted); }
.action.recommended { border-color: #9bb18c; background: #f2f7eb; }
.action-recommend-label {
  display: inline-flex;
  align-items: center;
  padding: 2px 6px;
  margin: 4px 0;
  border-radius: 4px;
  color: var(--positive);
  background: #e0ecd5;
  font-size: 10px;
  font-weight: 600;
  line-height: 1.6;
}
.turn-hint { font-size: 12px; line-height: 1.8; }
.ap-dots { gap: 5px; }
.ap-dots span { width: 9px; height: 9px; }
.profile-meta, .profile-location, .stat-line, .stat-line strong,
.opinion-row, .chart-labels, .career-caption, .recent-row p,
.office-card .desc, .office-card .rule, .policy-card p, .policy-meta,
.party-card p, .person p, .timeline-item p, .sources a,
.seat-label, .result-row .between, .result-why { font-size: 12px; }
.stat-line { grid-template-columns: 62px 1fr 25px; }
.stat-line .track { height: 5px; }
.career-caption { gap: 8px; font-size: 10px; }
.recent-row h3 { font-size: 13px; }
.log-time { font-size: 11px; min-width: 62px; }
.office-card .desc, .office-card .rule { line-height: 1.85; }
.office-card .rule { color: #766647; }
.notice { color: #616a52; font-size: 12px; }
.party-card h3 { font-size: 14px; }
.footnote, .footnote button { font-size: 10px; }
.footnote button { min-height: 44px; }
.rules-table { font-size: 12px; }
.field label { font-size: 12px; }
.field input, .field select { min-height: 46px; font-size: 14px; }
.background-option { min-height: 68px; font-size: 13px; }
.background-option small { font-size: 11px; line-height: 1.7; }
.modal-copy { font-size: 13px; }
.modal-head { position: sticky; top: 0; z-index: 3; background: var(--paper); }
.modal-actions { flex-wrap: wrap; }
dialog { max-height: min(94vh, 960px); overscroll-behavior: contain; }
#toast { font-size: 13px; line-height: 1.8; }

/* First steps and contextual growth feedback keep the next action visible. */
.onboarding-card { background: #f0f5e8; border-color: #d4e0c9; }
.onboarding-card h2 { font-family: var(--serif); font-size: 23px; line-height: 1.6; margin: 8px 0; }
.onboarding-card p { max-width: 670px; font-size: 13px; color: var(--muted); line-height: 1.9; }
.onboarding-card .flex { flex-wrap: wrap; margin-top: 17px; }
.next-step { border-color: #d6e0cf; }
.next-step h3 { font-size: 15px; }
.next-step .between { align-items: flex-start; }
.step-list { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0; margin: 19px 0 0; }
.step-list li { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; color: var(--muted); }
.step-number { display: grid; place-items: center; width: 25px; height: 25px; flex: 0 0 25px; border-radius: 50%; background: #edf0e7; font-size: 11px; font-weight: 700; }
.step-copy { min-width: 0; font-size: 12px; line-height: 1.75; }
.step-copy strong { display: block; font-size: 13px; color: var(--ink); }
.step-copy p, .step-copy small { display: block; font-size: 11px; line-height: 1.75; margin-top: 3px; }
.step-list .step-active { border-color: #94ac83; background: #eff6e7; }
.step-active .step-number { background: var(--green); color: #fff; }
.context-badge { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 5px 9px; border-radius: 5px; background: #f5efdf; color: #826638; font-size: 11px; line-height: 1.7; }
.outcome-card { padding: 20px; border: 1px solid #b9d0a7; border-radius: 10px; background: #f1f7eb; }
.outcome-card .section-label { font-size: 12px; margin-bottom: 8px; }
.outcome-card h3 { font-size: 16px; line-height: 1.7; }
.outcome-card > p { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.85; }
.outcome-changes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 17px; }
.outcome-stat { padding: 12px 13px; border: 1px solid #dce7d3; border-radius: 7px; background: #fffefa; min-width: 0; }
.outcome-stat small { display: block; font-size: 11px; color: var(--muted); line-height: 1.7; }
.outcome-stat strong { display: block; color: var(--positive); font-size: 23px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.outcome-stat span { display: block; font-size: 11px; color: var(--muted); line-height: 1.7; }
.outcome-stat.negative, .outcome-stat:has(.negative) { background: #fff9f1; border-color: #ead9c2; }
.outcome-stat.negative strong, .outcome-stat strong.negative { color: var(--negative); }
.outcome-stat.neutral strong, .outcome-stat strong.neutral { color: var(--muted); }

/* Character creation: one selected person, a bounded list, and explicit game settings. */
.identity-profile { padding: 22px; border: 1px solid #d9dfce; border-radius: 11px; background: #f8f7ef; }
.identity-profile h3 { font-family: var(--serif); font-size: 19px; line-height: 1.7; margin: 6px 0 10px; }
.identity-profile p { color: var(--muted); font-size: 12px; line-height: 1.9; }
.identity-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
.identity-tag { padding: 5px 9px; border-radius: 5px; border: 1px solid #d5dfc8; background: #eff5e6; font-size: 11px; color: var(--green); }
.identity-trait { border-left: 3px solid #a4b78f; padding: 9px 13px; margin-top: 13px; font-size: 12px; line-height: 1.9; color: #56664d; }
.campaign-budget { padding: 22px; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); }
.campaign-budget h3 { font-size: 16px; }
.campaign-budget > p { font-size: 12px; line-height: 1.85; color: var(--muted); margin-top: 8px; }
.money-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 17px; }
.money-item { min-width: 0; border: 1px solid #dfe5d8; border-radius: 7px; padding: 13px; background: #f6f8f0; }
.money-item.available { background: #edf5e6; border-color: #c9d9b9; }
.money-item.reserved { background: #f4f1e9; border-color: #e2dbcd; }
.money-item.potential { border-style: dashed; border-color: #c9af79; background: #fbf6e9; }
.money-label { font-size: 11px; color: var(--muted); display: block; line-height: 1.7; }
.money-value { font-size: 22px; line-height: 1.65; color: var(--green); font-weight: 600; display: block; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; letter-spacing: -.5px; }
.money-item.reserved .money-value { color: #75674d; }
.money-item.potential .money-value { color: #876931; }
.money-caption { font-size: 10px; color: var(--muted); line-height: 1.8; display: block; margin-top: 3px; }
.budget-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.budget-row:last-child { border-bottom: 0; }
.budget-row strong { font-size: 13px; font-variant-numeric: tabular-nums; }
.budget-note { font-size: 11px; color: var(--muted); line-height: 1.85; border-left: 2px solid #c6b48e; padding-left: 12px; margin-top: 15px; }
dialog.new-game-dialog { width: 820px; max-width: min(820px, calc(100vw - 32px)); }
.new-game-dialog .modal-head h2 { font-size: 23px; }
.start-mode-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; padding: 5px; background: #eef1e7; border: 1px solid #dfe4d6; border-radius: 9px; margin-bottom: 20px; }
.start-mode-tabs button { min-height: 46px; border: 1px solid transparent; border-radius: 6px; padding: 10px 14px; color: var(--muted); font-size: 13px; font-weight: 600; }
.start-mode-tabs button.active { border-color: #c5d1b9; background: var(--paper); color: var(--green); box-shadow: 0 2px 6px #264b3410; }
.mode-note, .inline-help { font-size: 12px; color: var(--muted); line-height: 1.85; }
.mode-note { margin: 10px 0 16px; }
.inline-help { display: block; margin-top: 7px; }
.roster-tools { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(150px, 1fr); gap: 11px; margin: 15px 0 10px; }
.roster-tools input, .roster-tools select { width: 100%; min-height: 46px; border: 1px solid #d5ddcd; border-radius: 7px; background: #fff; padding: 10px 12px; color: var(--ink); font-size: 14px; }
.roster-count { font-size: 11px; color: var(--muted); margin: 10px 0; line-height: 1.8; }
.roster-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; max-height: 380px; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; padding: 5px; margin: 0 -5px 12px; scroll-padding: 8px; border-top: 1px solid #e7ebdf; border-bottom: 1px solid #e7ebdf; }
.roster-option { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 91px; border: 1px solid #dfe5d7; border-radius: 8px; background: #fffefa; padding: 12px; text-align: left; transition: border-color .15s, background .15s; }
.roster-option:hover { background: #f4f8ee; border-color: #94ad82; }
.roster-option.selected { border: 2px solid var(--green); padding: 11px; background: #eaf3e2; box-shadow: 0 0 0 1px #eaf3e2; }
.roster-option .person-avatar { width: 39px; height: 45px; border-radius: 6px; font-size: 21px; }
.roster-option > div:not(.person-avatar) { min-width: 0; }
.roster-option h3 { font-size: 14px; line-height: 1.65; margin: 0; }
.roster-option p { font-size: 11px; color: var(--muted); line-height: 1.75; margin-top: 2px; }
.roster-option small { display: block; font-size: 10px; color: var(--muted); line-height: 1.7; margin-top: 3px; overflow-wrap: anywhere; }
.roster-option.selected h3 { color: var(--green); }
.roster-empty { grid-column: 1 / -1; padding: 34px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.9; }
.roster-more { min-height: 44px; margin: 4px auto 17px; display: flex; align-items: center; justify-content: center; border: 1px solid #d2ddc7; border-radius: 6px; padding: 9px 18px; color: var(--green); background: #f2f6ec; font-size: 12px; }
.roster-selection { padding: 17px; margin: 17px 0; border-color: #a7bc97; background: #eef5e6; }
.roster-selection .between { gap: 14px; align-items: flex-start; }
.roster-selection h3 { font-size: 17px; }
.roster-selection p, .roster-selection small { color: var(--muted); font-size: 12px; line-height: 1.8; }
.roster-selection .portrait { background: #dce8d2; flex-shrink: 0; }
.difficulty-options, .career-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 8px; }
.option-card { display: flex; align-items: flex-start; gap: 9px; min-height: 81px; border: 1px solid #dce3d3; border-radius: 7px; padding: 13px; cursor: pointer; background: #fffefa; }
.option-card:hover { background: #f7f9f2; border-color: #a7b896; }
.option-card:has(input:checked) { background: #edf5e5; border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.option-card input { width: 17px; min-width: 17px; height: 17px; min-height: 17px; margin: 4px 0 0; padding: 0; accent-color: var(--green); }
.option-card > span { min-width: 0; }
.option-card strong { display: block; font-size: 13px; line-height: 1.7; }
.option-card small { display: block; font-size: 11px; color: var(--muted); line-height: 1.8; margin-top: 3px; }
.new-game-dialog .modal-actions { position: sticky; bottom: -26px; z-index: 2; border-top: 1px solid #e1e7d9; margin: 23px -26px -25px; padding: 16px 26px; background: #fffefaf5; backdrop-filter: blur(8px); }
.new-game-dialog .modal-actions .btn:last-child { min-width: 165px; }

/* Second review: final markup, disclosure controls, and money summaries. */
.creator-fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
  width: 100%;
}
.creator-fieldset > legend {
  max-width: 100%;
  padding: 0;
  margin-bottom: 5px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.8;
}
.creator-details, .campaign-details {
  min-width: 0;
  margin: 17px 0 21px;
  padding: 0 15px;
  border: 1px solid #d9e1cf;
  border-radius: 8px;
  background: #f7f9f2;
}
.creator-details > summary, .campaign-details > summary {
  cursor: pointer;
  min-height: 48px;
  padding: 12px 15px;
  margin: 0 -15px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.8;
  color: var(--green);
  overflow-wrap: anywhere;
}
.creator-details > summary::marker, .campaign-details > summary::marker { color: #66815b; }
.creator-details > summary:hover, .campaign-details > summary:hover { background: #eef4e6; }
.creator-details > summary:focus-visible, .campaign-details > summary:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
.creator-details[open], .campaign-details[open] { padding-bottom: 16px; }
.creator-details[open] > summary, .campaign-details[open] > summary {
  margin-bottom: 16px;
  border-bottom: 1px solid #dce5d3;
  border-radius: 7px 7px 0 0;
}
.creator-details .form-grid { min-width: 0; }
.roster-option > span:not(.person-avatar) { min-width: 0; flex: 1; }
.roster-option > .person-avatar { flex-shrink: 0; }
.roster-option strong { display: block; font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
.roster-option.selected strong { color: var(--green); }
.roster-option > .icon { width: 17px; height: 17px; flex-shrink: 0; color: var(--green); }
.roster-more:has(> .btn) { padding: 0; border: 0; background: transparent; }
.metric-number.metric-money { font-size: clamp(17px, 1.5vw, 21px); letter-spacing: -.6px; min-height: 40px; line-height: 1.9; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.metric-number.metric-money small:empty { display: none; }
.money-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.money-value { line-height: 1.75; }
.budget-row { min-width: 0; flex-wrap: wrap; align-items: center; }
.budget-row > span { min-width: 0; overflow-wrap: anywhere; }
.budget-row > strong { min-width: 0; margin-left: auto; overflow-wrap: anywhere; text-align: right; }
.budget-row > .tabs { max-width: 100%; margin: 0; gap: 6px; justify-content: flex-end; }
.budget-row .filter-tab { padding: 8px 11px; }
.campaign-budget > .between { align-items: flex-start; flex-wrap: wrap; }
.campaign-budget h2 { font-size: 19px; line-height: 1.8; margin-top: 4px; }
.campaign-budget .creator-details, .campaign-budget .campaign-details { margin-top: 19px; margin-bottom: 13px; }
.identity-profile > h2 { font-family: var(--serif); font-size: 23px; font-weight: 600; color: var(--green-dark); line-height: 1.65; margin: 13px 0 9px; }
.identity-profile > .between { align-items: flex-start; flex-wrap: wrap; }
.identity-profile > .between .eyebrow { font-size: 9px; letter-spacing: 1.4px; }

 if(saveBlocked||(!game.tick&&!game.choiceCount&&!game.results.length))return true;
 const profile=E.identityProfile(game),summary={id:`${game.storySeed??game.seed}-${game.tick}-${game.choiceCount||0}-${game.name}`,name:game.name,startYear:2026,endYear:E.date(game).year,title:profile.title,choices:profile.choices,wins:game.results.filter(r=>r.won).length,policies:game.completed.length,examples:profile.examples.slice(0,2).map(e=>({title:e.title,text:e.text}))};

function seatChart(){let dots='';for(let row=0;row<6;row++){let count=40+row*4;for(let i=0;i<count;i++){let a=Math.PI-i/(count-1)*Math.PI,r=46+row*11;dots+=`<circle cx="${130+Math.cos(a)*r}" cy="${113-Math.sin(a)*r}" r="2.1" fill="${i/count>.846?'#c4ab7f':'#8ba080'}"/>`;}}return `<svg class="hemicycle" viewBox="0 0 260 125" role="img" aria-label="국회 300석: 지역구 254석, 비례대표 46석. 도식의 점 수는 축약 표현입니다.">${dots}<text x="130" y="96" text-anchor="middle" font-size="23" fill="#3e5343" font-family="sans-serif">300</text><text x="130" y="111" text-anchor="middle" font-size="8" fill="#8a947e">국회의원 정수</text></svg>`;}
function profile(){const level=game.office?E.office(game.office.id).level:0,p=selectedPerson();return `<section class="card card-pad"><div class="between" style="margin-bottom:17px"><span class="eyebrow">MY POLITICAL LIFE</span>${textBtn('설정','settings')}</div><div class="profile-head">${p?`<div class="person-avatar" style="color:${E.party(game.party).color};background:${E.party(game.party).color}13" aria-label="실존 인물의 이름표">${esc(game.name.slice(0,1))}</div>`:portrait()}<div><h3>${esc(game.name)} <span class="small muted">${E.age(game)}세</span></h3><div class="profile-meta">${game.office?E.office(game.office.id).name:'새로운 정치 인생의 시작'}</div></div></div><div class="flex" style="flex-wrap:wrap">${badge(`<i class="dot" style="color:${E.party(game.party).color}"></i>게임 소속 · ${esc(scenarioPartyName(game.party))}`,'outline')}${badge(game.difficulty==='easy'?'쉬움':'보통')}${p?badge('실존 인물 · 가상 커리어','gold'):''}</div>${p?`<p class="small muted" style="margin-top:9px">공개 자료: ${esc(p.cohort||'과거 자료')} · ${esc(p.role)}${p.region?' · '+esc(p.region):''}<br>이번 플레이의 나이·직위·성장은 새로운 가상 설정입니다.</p>`:''}<div class="profile-location">${icon('pin')}${esc(game.region)}</div><div class="profile-stats">${['policy','network','energy'].map(k=>`<div class="stat-line"><span class="muted">${STAT_NAMES[k]}</span><div class="track"><span style="width:${game.stats[k]}%"></span></div><strong>${Math.round(game.stats[k])}</strong></div>`).join('')}</div><div class="career-track">${Array.from({length:6},(_,i)=>`<span class="career-step ${i<=level?'done':''}"></span>`).join('')}</div><div class="career-caption"><span>${game.office?'공직에서 쌓는 경험':'새로운 시작'}</span><span>${CAREER_STYLES.find(x=>x.id===game.careerStyle)?.name||'나만의 정치 스타일'}</span></div></section>`;}
function nextCard(){const o=game.target?E.office(game.target.id):OFFICES[0],next=game.target?{tick:game.target.tick,year:2026+Math.floor(game.target.tick/4)}:E.nextElection(game,o),remain=next.tick-game.tick;return `<section class="card election-card"><div class="between"><span class="eyebrow">${game.target?'MY NEXT CHALLENGE':'THE NEXT ELECTION'}</span>${icon('ballot','icon-big')}</div><h3>${game.target?o.name:'전국동시지방선거'}</h3><p class="countdown">${next.year}년 · ${remain===0?'이번 분기 개표':`${remain}분기 뒤 개표`}</p><p class="small muted" style="margin-top:10px">${game.target?'지금의 선택들이 선거날의 답이 됩니다.':'첫 도전의 무대를 정해 보세요.'}</p>${btn(`${game.target?'출마 계획 보기':'나의 첫 선거 준비'} ${icon('arrow')}`,'nav','elections','secondary full')}</section>`;}

function narrativeText(text){return hasOutcomeNumbers(text)?String(text).split(/ · (?=(?:신뢰|인지도|정책 역량|조직력|체력|활동 자원|활동 준비도|공공 예산|성과)\s+[+−-]?\d)/)[0]:String(text||'');}

function renderNextStep(){return `<section class="card card-pad next-step"><div class="between"><div><h3>${game.eventResolved?'입장을 정했습니다. 이제 시간을 흘려보내세요.':'이번 분기, 어떤 입장을 내놓겠습니까?'}</h3><p class="small muted">사건에서 선택한 뒤 바로 다음 분기로 진행하세요. 일상은 정해 둔 운영방침에 따라 이어집니다.</p></div>${badge(game.difficulty==='easy'?'쉬움':'보통','outline')}</div></section>`;}
function renderAgenda(){const options=E.agendaOptions(game),current=options.find(a=>a.id===(game.agenda||'field'))||options[0];return `<details class="card card-pad agenda-panel"><summary>지속 운영방침 · ${esc(current.name)}</summary><p class="small muted">한 번 정하면 다음 분기에도 유지됩니다. 매번 고를 필요는 없습니다. ${esc(current.description)}</p><div class="agenda-options" role="group" aria-label="지속 운영방침">${options.map(a=>`<button type="button" class="option-card ${a.id===current.id?'selected':''}" data-action="agenda" data-value="${a.id}" aria-pressed="${a.id===current.id}" ${game.ended?'disabled':''}><strong>${esc(a.name)}</strong><span>${esc(a.description)}</span><small>${esc(a.tradeoff)}</small></button>`).join('')}</div>${game.lastAgenda?renderOutcomeCard(game.lastAgenda,'지난 분기, 이어진 일상'):''}</details>`;}
function renderIntervention(){return `<details class="card card-pad intervention-panel"><summary>직접 개입하기 · 선택 사항</summary><p class="small muted">정해 둔 일상 외에 직접 챙길 일이 있을 때만 사용하세요. 한 분기에 한 번이며, 후원 모금·정당 지원 요청·인물 교류 등과 같은 기회를 사용합니다. 건너뛰어도 다음 분기로 진행할 수 있습니다.</p>${game.ap<1?'<p class="inline-help">이번 분기에는 이미 직접 개입했습니다. 다음 분기에는 다시 나설 수 있습니다.</p>':''}<div class="action-grid">${ACTIONS.map(a=>`<button class="action" data-action="activity" data-value="${a.id}" ${game.ap<1||game.actions.includes(a.id)||game.ended?'disabled':''}><span class="action-icon">${icon(a.icon)}</span><div><h3>${esc(a.name)}${game.actions.includes(a.id)?' ✓':''}</h3><p>${esc(a.desc)}</p></div></button>`).join('')}</div></details>`;}
function renderHomeMetrics(){return `<details class="card card-pad status-panel"><summary>현재 나의 기반 살펴보기</summary><div class="metric-grid">${[{label:'국민의 신뢰',n:game.stats.trust,unit:'점',note:'약속을 대하는 시선',ic:'heart'},{label:'나의 인지도',n:game.stats.recognition,unit:'점',note:'당신을 기억하는 정도',ic:'eye'},{label:'선거 계좌 잔액',n:game.money?.campaignCash||0,display:won(game.money?.campaignCash||0),unit:'',note:'선거 한정 지원금은 별도',ic:'briefcase',money:true},{label:'정책 성과',n:game.completed.length,unit:'개',note:game.office?'현재 공직에서 실현 중':'당선 후 만들어 갈 변화',ic:'leaf'}].map(m=>`<div class="metric"><div class="metric-label">${m.label}${icon(m.ic)}</div><div class="metric-number ${m.money?'metric-money':''}">${m.display||Math.round(m.n)}<small>${m.unit}</small></div><div class="metric-note">${m.note}</div></div>`).join('')}</div></details>`;}
function renderHome(){const ev=E.currentEvent(game);return `<div class="layout"><div class="stack">${saveBlocked?`<section class="notice"><strong>${esc(loadMessage)}</strong><p>현재 화면은 임시 새 게임입니다. 새 인생을 확정하거나 정상 저장 파일을 불러오기 전까지 자동 저장하지 않습니다.</p>${btn('원본 기록 내보내기','exportOriginal','','secondary tiny')}</section>`:''}${game.ended?`<div class="card end-card"><h2>당신은 어떤 정치인으로 기억될까요?</h2><p>당선 ${game.results.filter(r=>r.won).length}회 · 정책 성과 ${game.completed.length}개 · ${game.logs.length}개의 기록</p><div style="margin-top:20px">${btn('나의 일대기 읽기','nav','history')} ${btn('새로운 인생 시작','new','','secondary')}</div></div>`:''}${game.tick===0?`<section class="card hero"><div class="hero-copy"><div class="eyebrow">YOUR CHOICE. OUR TOMORROW.</div><h2>내가 정치인이 된다면,<br>어떤 정치인일까?</h2><p>이기기 위해 어디까지 타협할 것인가.<br>지키려는 약속과 얻고 싶은 자리 사이에서 선택하세요.</p><div class="hero-tag">대한민국 정치인 시뮬레이터</div></div>${building()}</section>`:''}${game.tick===0&&!game.politicianId?`<section class="card card-pad onboarding-card"><div class="eyebrow">CHOOSE YOUR POLITICAL LIFE</div><h2>누구의 정치 인생을 시작할까요?</h2><p>실존 정치인 ${PEOPLE.length}명 중 한 명을 고르거나, 나만의 인물을 만들어 보세요. 기본 난이도는 쉬움입니다.</p><div class="flex">${btn('실제 정치인 선택','new')}${btn('나로 시작하기','newCustom','','secondary')}</div></section>`:''}${!game.ended?renderNextStep():''}<section class="card story"><div class="story-top"><div class="section-label">${icon('message')}이번 분기의 선택</div>${badge(esc(ev.tag),'gold')}</div><h2>${ev.title.split('\n').map(esc).join('<br>')}</h2><p class="story-description">${esc(ev.text)}</p><div class="story-choices">${ev.choices.map((c,i)=>`<button class="choice ${game.choice===i?'selected':''}" data-action="choose" data-value="${i}" ${game.eventResolved||game.ended?'disabled':''}><span class="choice-number">${game.choice===i?'✓':['A','B','C'][i]}</span><div class="choice-copy"><strong>${esc(c.title)}</strong><p>${esc(c.desc)}</p></div>${icon('chevron','choice-chevron')}</button>`).join('')}</div>${game.eventResolved?`<div class="decision-result">${icon('check')}입장을 기록했습니다. 이제 다음 분기로 넘어갈 수 있습니다.</div>`:'<p class="small muted" style="margin-top:15px">모두를 만족시키기는 어렵습니다. 무엇을 얻고 무엇을 감수할지 고르세요.</p>'}</section>${renderOutcome()}${!game.ended?`<section class="card card-pad turn-footer"><div class="turn-hint">${game.eventResolved?'나의 선택과 운영방침에 따라 다음 분기의 정치가 이어집니다.':'이번 사건에 대한 입장을 먼저 정해 주세요.'}</div>${btn(`다음 분기로 ${icon('arrow')}`,'advance','','',!game.eventResolved)}</section>${renderAgenda()}${renderIntervention()}`:''}${renderIdentity()}${renderHomeMetrics()}<section class="card card-pad"><div class="section-header"><h3>최근의 발자취</h3>${textBtn('일대기 보기','nav','history')}</div>${game.logs.slice(0,3).map(l=>`<div class="recent-row"><span class="log-time">${shortDate(l.tick)}</span><span class="recent-dot"></span><div><h3>${esc(l.title)}</h3><p>${esc(narrativeText(l.text))}</p></div></div>`).join('')}</section></div>${right()}</div>`;}
function renderCampaignBudget(){if(!E.campaignQuote||!game.money)return '';const id=game.target?.id||(/세종|제주/.test(game.region)?'metro-council':'council'),o=E.office(id),q=E.campaignQuote(game,id),m=game.money,partyPays=q.payer==='party',pending=(m.pending||[]).reduce((sum,p)=>sum+p.amount,0);return `<section class="card card-pad campaign-budget"><div class="between"><div><span class="eyebrow">CAMPAIGN BUDGET</span><h2>${o.name} · 선거 준비금</h2></div>${badge(partyPays?'정당 회계':'개인 선거 회계','outline')}</div><p class="small muted">${game.target?'현재 출마 계획 기준입니다.':'아직 목표가 없어 첫 지역의회 도전을 기준으로 보여드립니다.'}</p><div class="money-grid"><div class="money-item available"><span class="money-label">이번 선거에 쓸 수 있는 자금</span><strong class="money-value">${won(q.cash)}</strong><span class="money-caption">선거 계좌 ${won(m.campaignCash)}<br>+ 이 선거 한정 정당 지원 ${won(q.grant)}</span></div><div class="money-item reserved"><span class="money-label">후보 등록에 필요한 선거 자금</span><strong class="money-value">${won(q.requiredCash??(partyPays?0:q.total))}</strong><span class="money-caption">${partyPays?'선거 비용은 정당 회계에서 부담':'기탁금 + 선거운동비 + 준비비'}</span></div><div class="money-item ${q.shortfall?'reserved':'available'}"><span class="money-label">부족한 현금</span><strong class="money-value">${won(q.shortfall)}</strong><span class="money-caption">${q.shortfall?'규모를 줄이거나 자금을 준비하세요.':'현재 계획을 준비할 수 있습니다.'}</span></div><div class="money-item potential"><span class="money-label">선거 후 받을 예정 보전금</span><strong class="money-value">${won(pending)}</strong><span class="money-caption">정산 전에는 사용할 수 없습니다.</span></div></div><div class="budget-row"><span>선거 규모</span><div class="tabs" role="group" aria-label="선거운동 규모">${[{id:'lean',label:'소규모'},{id:'standard',label:'기본 규모'},{id:'broad',label:'넓게'}].map(p=>`<button type="button" class="filter-tab ${q.plan===p.id?'active':''}" aria-pressed="${q.plan===p.id}" data-action="campaignPlan" data-value="${p.id}">${p.label}</button>`).join('')}</div></div><p class="budget-note">한도 기준: ${esc(q.limitNote)}</p><div class="budget-row"><span>개인 저축 ${won(m.personalSavings)}</span>${btn('내 자금 500만 원 출연','contribute','5000000','secondary tiny',m.personalSavings<5000000)}</div><div class="flex" style="flex-wrap:wrap">${btn('후원금 모집','fundraise','','secondary tiny')}${btn('정당 지원 요청','partySupport','','secondary tiny',game.party==='ind')}</div><details class="creator-details"><summary>돈이 어디에 쓰이고, 언제 돌아오나요?</summary><div class="budget-row"><span>기탁금</span><strong>${won(q.deposit)}</strong></div><div class="budget-row"><span>선거운동 지출 계획</span><strong>${won(q.spending)}</strong></div><div class="budget-row"><span>준비비 · 보전 제외</span><strong>${won(q.overhead)}</strong></div><div class="budget-row"><span>${partyPays?'정당 부담 총액':'계획 총액'}</span><strong>${won(q.total)}</strong></div><div class="budget-row"><span>참고 선거비용 한도</span><strong>${won(q.limit)}</strong></div><p class="budget-note">당선 또는 15% 이상 득표 시 인정 선거비용 전액, 10% 이상 15% 미만이면 절반 보전을 모의합니다. 심사에서 인정되는 비용만 대상이며 준비비는 제외합니다. 정당 회계로 진행하는 선거의 부담과 보전은 개인 회계와 분리합니다.</p></details><p class="budget-note">모든 인물은 같은 가상 초기 자금으로 시작합니다. 정당 회계 선거의 비용 전액 지원은 게임 가정이며 실제 재산·후원·지원 정책을 재현하지 않습니다. 활동 준비도는 돈과 별개입니다.</p></section>`;}
function renderElections(){return `<div class="layout"><div>${!game.results.length&&!game.office?`<section class="card card-pad onboarding-card"><div class="eyebrow">YOUR FIRST ELECTION</div><h2>처음이라면, 동네 의회부터.</h2><p>구·시·군의원은 한 선거구에서 여러 명을 뽑아 첫 도전을 익히기 좋은 경로입니다. ${/세종|제주/.test(game.region)?'현재 활동 지역은 기초의회 선거가 없어 광역의회에 도전할 수 있습니다.':''}</p><div class="flex">${btn('첫 출마 준비하기','declare',/세종|제주/.test(game.region)?'metro-council':'council')}${badge(game.difficulty==='easy'?'쉬움 · 첫 기초의회 공천 지원':'보통 난이도','outline')}</div><p class="inline-help">공천 = 정당이 후보를 고르는 절차 · 비례대표 = 정당의 명부 순번으로 도전하는 경로</p></section>`:''}<div class="notice"><strong>직함은 목표, 평가는 유권자의 몫.</strong><br>출마 선언 → 공천·자격 심사 → 가상 투표 → 당선 또는 재도전. 한 번에 한 선거만 준비할 수 있습니다. 선거 자금은 원화로 관리합니다. 등록 전 필요한 현금과 선거 후 보전될 수 있는 돈을 구분하세요.</div>${renderCampaignBudget()}${game.byElection?`<div class="card card-pad" style="margin-bottom:18px"><div class="between"><div>${badge('가상 재보궐선거','gold')}<h3 style="margin-top:9px">국회의원 빈자리에 도전하시겠습니까?</h3><p class="small muted">${game.byElection.tick-game.tick}분기 뒤 · 당선 시 남은 임기만 수행</p></div>${btn('재보궐 도전','by',game.byElection.id,'secondary')}</div></div>`:''}<div class="tabs" role="group" aria-label="선거 종류">${[['all','모든 선거'],['local','지방선거'],['assembly','국회의원'],['president','대통령']].map(([id,name])=>`<button class="filter-tab ${filter===id?'active':''}" data-action="filter" data-value="${id}" aria-pressed="${filter===id}">${name}</button>`).join('')}</div><div class="office-grid">${OFFICES.filter(o=>filter==='all'||o.group===filter).map(o=>{const err=E.eligibility(game,o),next=E.nextElection(game,o),q=E.campaignQuote?.(game,o.id);return `<article class="card office-card ${game.target?.id===o.id?'target':''}"><div class="between full">${badge(o.label,'outline')}<span class="small muted">${o.term}년 임기</span></div><h3>${o.name}</h3><p class="desc">${o.desc}</p><div class="rule">${next.label}<br>${q?`기탁금 ${won(q.deposit)} · ${q.payer==='party'?'정당 회계 부담':`등록 준비 현금 ${won(q.requiredCash??q.total)}`}`:'선거 예산 준비 중'}<br>${o.method.startsWith('pr')?'명부 순번과 정당 득표로 결정':'정당 소속이면 후보 선정 심사를 거칩니다'}</div>${game.target?.id===o.id?btn('출마 준비 중 ✓','cancelTarget','','secondary'):btn(err?'출마 조건 확인':'이 선거에 도전','declare',o.id,err?'secondary':'')}${err?`<p class="small muted" style="margin-top:10px;font-size:9px">${esc(err)}</p>`:''}</article>`;}).join('')}</div><p class="small muted" style="margin-top:18px">2026 지방선거·2028 총선·2030 대선을 출발점으로 임기 주기를 적용한 가상 일정입니다. 미래 실제 선거일을 예측하지 않습니다.</p></div><aside class="right-column stack">${profile()}<section class="card card-pad"><div class="section-header"><h3>서로 다른 두 표</h3>${icon('ballot')}</div>${seatChart()}<div class="seat-label"><span>● 지역구 254석</span><span>● 비례대표 46석</span></div><div class="divider"></div><p class="small muted">지역구에서는 사람을, 비례대표에서는 정당을 선택합니다. 비례대표는 정당의 의석 수와 나의 순번이 모두 중요합니다.</p>${textBtn('선거제도 읽기','nav','guide')}</section>${game.results.length?`<section class="card card-pad"><h3>최근 선거 기록</h3>${game.results.slice(0,3).map((r,i)=>`<div class="recent-row"><div><h3>${r.name} · ${r.won?'당선':'도전'}</h3>${textBtn('결과 다시 보기','result',i)}</div></div>`).join('')}</section>`:''}</aside></div>`;}
function renderPolicies(){return `<div class="layout"><div><div class="notice"><strong>${game.office?`${E.office(game.office.id).name}로서 약속을 실천할 시간입니다.`:'선거 전에 약속하고, 당선 후에 증명하세요.'}</strong><br>핵심 공약은 최대 3개. 당선 후에는 예산과 협력을 확보해 추진합니다. 미완료 공약은 임기 말 신뢰에 반영됩니다.</div><div class="between" style="margin-bottom:18px"><h2>나의 정책 포트폴리오</h2>${badge(`공약 ${game.pledges.length} / 3`)}</div><div class="policy-grid">${POLICIES.map(p=>{const project=game.projects.find(x=>x.id===p.id),done=game.completed.includes(p.id),pledged=game.pledges.includes(p.id);return `<article class="card policy-card"><div class="between">${badge(p.category,'outline')}${done?badge('성과 달성'):project?badge('추진 중','gold'):''}</div><h3>${p.name}</h3><p>${p.desc}</p><div class="policy-meta"><span>예산 ${p.cost}</span><span>최소 ${p.quarters}분기</span></div>${project?`<div class="progress"><span style="width:${Math.max(5,(game.tick-project.started)/(project.due-project.started)*100)}%"></span></div><p class="small">성과 확인까지 ${project.due-game.tick}분기</p>`:''}<div class="policy-bottom">${btn(pledged?'공약 선택됨 ✓':'공약에 추가','pledge',p.id,'secondary tiny')}${done?'':btn(project?'추진 중':'추진하기','project',p.id,'tiny',!!project||!game.office)}</div></article>`;}).join('')}</div></div><aside class="right-column stack">${profile()}<section class="card card-pad"><h3>지금, 실행할 수 있는 것</h3><div class="metric-number" style="margin-top:16px">${Math.round(game.budget)}<small>/ 100 공공 예산</small></div><p class="small muted">당선 후 분기마다 예산 ${game.difficulty==='easy'?14:10}을 확보합니다. 정책 역량과 조직력이 높을수록 협의와 집행에 성공할 가능성이 커집니다.</p><div class="divider"></div><p class="small muted">의원은 조례·법안 발의와 예산 협의, 단체장·대통령·교육감은 각 소관 사업의 집행을 모의합니다. 정책 규모와 심사 절차는 축약돼 있습니다.</p></section>${opinion()}</aside></div>`;}
function peopleCards(query,partyId,limit,creatorMode=false){const matches=findPeople(query,partyId),idPrefix=creatorMode?'creator':'people';return `<div class="roster-count" role="status">${matches.length}명 ${query?'검색됨':'등록'} · ${Math.min(limit,matches.length)}명 표시</div><div class="${creatorMode?'roster-grid':'people-grid'}">${matches.slice(0,limit).map(p=>creatorMode?`<button type="button" class="roster-option ${creator.politicianId===personId(p)?'selected':''}" data-action="selectPolitician" data-value="${esc(personId(p))}" aria-pressed="${creator.politicianId===personId(p)}"><span class="person-avatar" style="color:${E.party(p.party).color};background:${E.party(p.party).color}13">${esc(p.name.slice(0,1))}</span><span><strong>${esc(p.name)}</strong><small>${esc(E.party(p.party).name)} · ${esc(p.region||p.role)}</small><small>${esc(p.cohort||'과거 공개 자료')} 기준</small></span>${creator.politicianId===personId(p)?icon('check'):''}</button>`:`<article class="card person"><div class="person-avatar" style="color:${E.party(p.party).color};background:${E.party(p.party).color}13">${esc(p.name.slice(0,1))}</div><div><h3>${esc(p.name)}</h3><p>${esc(E.party(p.party).name)} · ${esc(p.cohort||'과거 자료')} 기준</p><p>${esc(p.role)}</p><p>${esc(p.region||'')}</p>${textBtn('이 인물로 플레이','playPerson',personId(p))}${textBtn('이력과 교류 보기','person',personId(p))}${game.relationships[personId(p)]||game.relationships[p.name]?`<p>가상 포럼 ${game.relationships[personId(p)]||game.relationships[p.name]}회</p>`:''}</div></article>`).join('')}</div>${!matches.length?`<div class="roster-empty"><p>조건에 맞는 인물이 없습니다.</p>${btn('검색 조건 초기화',creatorMode?'clearCreatorSearch':'clearPeopleSearch','','secondary tiny')}</div>`:''}${matches.length>limit?`<div class="roster-more">${btn(`24명 더 보기 · ${matches.length-limit}명 남음`,creatorMode?'rosterMore':'peopleMore','','secondary full')}</div>`:''}`;}
function renderPeople(){return `<div class="layout"><div class="stack"><div class="notice" style="margin:0"><strong>실제 이름으로 시작하는, 나만의 가상 정치 인생.</strong><br>실존 인물 ${PEOPLE.length}명을 선택해 플레이할 수 있습니다. 인물별 표시 시점의 공개 이력이며, 현재 소속·직책을 뜻하지 않습니다. 나이·능력·공직은 새 시나리오에서 설정합니다.</div><section><div class="section-header"><h2>플레이할 정치인을 찾아보세요</h2>${badge(`${PEOPLE.length}명`)}</div><div class="roster-tools"><div class="field"><label for="people-search">이름·지역·이력 검색</label><input id="people-search" type="search" placeholder="예: 이재명, 부산, 비례대표" value="${esc(peopleQuery)}" autocomplete="off"></div><div class="field"><label for="people-party-filter">자료 기준 소속 정당</label><select id="people-party-filter"><option value="all">모든 정당</option>${PARTIES.map(p=>`<option value="${p.id}" ${peopleParty===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div><div id="people-roster">${peopleCards(peopleQuery,peopleParty,peopleLimit)}</div></section><section><div class="section-header"><h2>나의 게임 속 정당</h2>${badge('정당 변경도 직접 개입')}</div><p class="small muted" style="margin-bottom:14px">공개 자료를 참고한 고정 시나리오 정당입니다. 실제 현재 존속·소속과 다를 수 있습니다.</p><div class="party-grid">${PARTIES.map(p=>`<article class="card party-card ${p.id===game.party?'selected':''}"><div class="party-symbol" style="background:${p.color}">${esc(p.short.slice(0,2))}</div><div><h3>${esc(p.name)}${p.historical?' · 2024 시나리오':''}${p.id===game.party?' · 현재 게임 소속':''}</h3><p>${esc(p.desc)}</p>${p.id===game.party?'<span class="small muted">함께 걷는 중</span>':textBtn(p.id==='ind'?'무소속으로 활동':'이 정당에 합류','party',p.id)}</div></article>`).join('')}</div></section><section class="card card-pad"><h3>비례대표 중심의 정치도 하나의 경로입니다.</h3><p class="muted" style="font-size:12px;margin-top:10px;line-height:1.9">정당을 선택하고 전문성과 조직력을 쌓아 비례대표 명부에 도전할 수 있습니다. 정당의 의석 수와 나의 명부 순번이 함께 당락을 결정합니다. 신당 창당·위성정당 협상·합당은 후속 확장 범위입니다.</p>${textBtn('비례대표 도전하기','nav','elections')}</section></div><aside class="right-column stack">${profile()}${opinion()}</aside></div>`;}
function renderHistory(){return `<div class="layout"><div class="stack"><section class="card hero" style="min-height:165px"><div class="hero-copy"><div class="eyebrow">THE LIFE YOU CHOSE</div><h2>${esc(game.name)}의 정치 일대기</h2><p>${2026}년부터 ${E.date(game).year}년까지 · ${game.results.filter(r=>r.won).length}번의 당선 · ${game.completed.length}개의 정책 성과</p></div>${building()}</section>${renderIdentity()}<section class="card card-pad"><div class="section-header"><h2>${game.ended?'이 선택들이 나의 정치였습니다.':'지금까지의 선택을 돌아볼까요?'}</h2></div><p class="muted">${game.ended?'이번 인생의 회고를 마쳤습니다. 다른 선택으로 새로운 정치 인생을 시작해 보세요.':'원하는 만큼 경험했다면 이 시점에서 회고를 마쳐도 됩니다. 대통령이 되거나 마지막 나이까지 기다릴 필요는 없습니다.'}</p><div class="flex" style="margin-top:16px;flex-wrap:wrap">${game.ended?btn('새로운 인생 시작','new'):btn('여기까지 회고하기','retire')}${btn(`${icon('download')} 현재 기록 저장`,'export','','secondary')}</div></section>${renderCareerArchives()}<div class="between"><h2>선택은 기록으로 남습니다.</h2></div><section class="card timeline">${game.logs.map(l=>`<article class="timeline-item"><div class="eyebrow">${shortDate(l.tick)} · ${l.type==='election'?'선거':l.type==='policy'?'정책':l.type==='result'?'선택의 결과':'나의 발자취'}</div><h3>${esc(l.title)}</h3><p>${esc(narrativeText(l.text))}</p>${hasOutcomeNumbers(l.text)?`<details class="creator-details"><summary>당시의 수치 기록 보기</summary><p>${esc(l.text)}</p></details>`:''}</article>`).join('')}</section></div><aside class="right-column stack">${profile()}${opinion()}</aside></div>`;}
function renderGuide(){return `<div class="layout"><div class="stack"><section class="card rule-section"><h2>작은 선택이 쌓여, 하나의 정치가 됩니다.</h2><p style="margin-top:12px">① 이번 분기의 사건에서 입장을 고릅니다. 정답을 맞히는 대신 내가 중요하게 생각하는 가치를 골라 보세요. ② 지속 운영방침이 평소의 현장·정책·관계·회복 일정을 자동으로 이어갑니다. 사건에서 선택한 뒤 바로 다음 분기로 넘어가도 됩니다. 꼭 직접 챙길 일이 있을 때만 선택 사항인 수동 개입을 사용하세요. ③ 선거와 도전에서 출마를 선언하고 다음 분기로 넘어갑니다. 선거 분기를 마치면 공천과 개표가 진행됩니다. 당선되면 공약을 실천하고, 낙선하면 다시 준비할 수 있습니다.</p></section><section class="card rule-section"><h3>반영한 선거의 기본 구조</h3><table class="rules-table"><thead><tr><th>선거</th><th>당선 방식</th><th>임기</th></tr></thead><tbody><tr><td>대통령</td><td>전국 최다 득표 · 40세 이상</td><td>5년 단임</td></tr><tr><td>지역구 국회의원</td><td>선거구 최다 득표</td><td>4년</td></tr><tr><td>비례 국회의원</td><td>정당투표 3% 또는 지역구 5석 · 준연동 46석</td><td>4년</td></tr><tr><td>광역·기초단체장</td><td>지역 전체 최다 득표 · 연속 3기 제한</td><td>4년</td></tr><tr><td>광역의회 지역구</td><td>최다 득표 1명</td><td>4년</td></tr><tr><td>기초의회 지역구</td><td>득표순 복수 당선 · 모의 3인 선거구</td><td>4년</td></tr><tr><td>광역·기초의회 비례</td><td>정당투표 5% · 의석과 명부 순번</td><td>4년</td></tr><tr><td>교육감</td><td>비정당 · 경력 5년 · 비당원 1년</td><td>4년</td></tr><tr><td>재보궐선거</td><td>가상 국회의원 결원 이벤트</td><td>잔여 임기</td></tr></tbody></table><p style="margin-top:15px">대통령 이외의 기본 피선거권 연령은 18세로 적용합니다. 비례대표 명부의 홀수 순번 여성 추천을 반영해 캐릭터 성별에 맞는 순번을 부여합니다. 교육감은 교육자 배경의 별도 경로입니다.</p></section><section class="card rule-section"><h3>현실의 제도와 게임의 가정</h3><p>이 버전은 2026년 1분기부터 분기 단위로 진행되는 프로토타입입니다. 2026 지방선거, 2028 총선, 2030 대선을 기준으로 주기를 반복합니다. 날짜·후보 등록·공천 과정은 분기로 압축하며, 미래 선거일을 확정해서 표시하지 않습니다.</p><p style="margin-top:12px">지지율, 정당 세력, 공천 확률, 선거운동 규모, 경쟁 후보의 출마와 인물 교류는 모두 게임용 가상 수치·사건입니다. 실제 지역별 정치 성향과 실제 여론조사는 사용하지 않습니다. 실존 인물의 발언이나 위법행위를 생성하지 않습니다.</p><p style="margin-top:12px">거주기간·국내 거주·국적·결격사유는 충족한 시민으로 가정합니다. 실제 전국 선거구·전체 정치인 명단, 선거구 획정 변동, 세종·제주의 최신 행정 개편, 후보 명부 인원 상한, 지방 비례의 특례, 선거비용 심사 세부 항목, 선거소송·탄핵·조기 대선은 아직 정밀 재현하지 않습니다. 세종·제주는 기초자치 선거가 없는 기본 구조를 사용합니다. 재보궐은 지역구 국회의원만 모의합니다.</p><p style="margin-top:12px">정책은 예산과 역량으로 성공 여부를 판정합니다. 공약 미이행은 임기 말 신뢰를 낮춥니다. 같은 이름의 정책을 반복해 성과를 쌓을 수 없으며, 다른 공직 출마에 필요한 사임은 공천 이후로 압축합니다. 교육감의 사업은 교육 관련 항목으로 제한합니다.</p></section><section class="card rule-section"><h3>선거 자금: 실제 규칙과 게임의 가정</h3><p>기탁금과 연령에 따른 감액, 선거 후 반환·보전의 기본 기준을 원화 회계에 반영합니다. 선거비용은 선거별 실제 공고 한도가 아니라 가상 선거구 인구에 따른 기본식 또는 2024 총선 평균 참고치입니다. 화면의 각 한도 기준을 확인해 주세요.</p><p style="margin-top:12px">정당 회계로 진행하는 비례대표·정당 추천 대선 경로의 비용 전액 지원은 게임 가정입니다. 선거 계좌 잔액과 해당 선거에만 쓰는 정당 지원, 선거 후 보전 예정액을 구분합니다. 후원금 잔액과 후원금 부담분의 보전금은 다음 선거의 재사용 자금에서 제외합니다. 실제 자금 출처별 인계처·인계 절차와 회계 심사는 축약했습니다. 자기재산 지출액 우선 공제와 당선 의원의 정치자금 재사용 특례는 아직 반영하지 않고, 게임에서는 부담 비율로 보전금을 나눕니다.</p><div class="sources" style="margin-top:16px">${F.FINANCE_SOURCES.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)} ↗</a>`).join('')}</div></section><section class="card rule-section"><h3>자료와 레퍼런스</h3><p style="margin-bottom:15px">제도 확인: 2026.10.26 · 인물: 명부에 표시된 과거 공개 자료 기준 · 국회 정수: 2024 총선 기준. 정당별 도덕성·능력치를 부여하지 않습니다.</p><div class="sources">${SOURCES.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${s.name} ↗</a>`).join('')}</div><div class="divider"></div><p>커리어의 축적과 선택 중심 진행은 <a href="https://kickru.com/" target="_blank" rel="noopener noreferrer">킥루</a>, <a href="https://1in8b.life/ko/" target="_blank" rel="noopener noreferrer">80억 분의 1</a>, <a href="https://slbcareer.com/" target="_blank" rel="noopener noreferrer">이번 생은 야구다</a>를 참고했습니다. 화면·문구·게임 코드는 새로 만들었습니다.</p></section><section class="card rule-section"><h3>저장과 이어하기</h3><p>현재 브라우저에 자동 저장됩니다. 이전 버전의 저장 파일도 이어할 수 있습니다. 다른 기기로 옮기거나 기록을 보관하려면 파일로 내보내세요. 브라우저 데이터가 지워지면 자동 저장도 사라집니다. 지난 인생 요약은 이 브라우저에 최근 5개까지 별도로 보관하며, 현재 게임 파일 내보내기에는 포함되지 않습니다.</p><div class="flex" style="margin-top:16px">${btn(`${icon('download')} 저장 파일 내보내기`,'export','','secondary')}${btn(`${icon('upload')} 불러오기`,'import','','secondary')}</div></section></div><aside class="right-column stack">${profile()}<section class="card card-pad"><h3>아직 정답은 없습니다.</h3><p class="muted" style="font-family:var(--serif);line-height:2;font-size:14px;margin-top:17px">“어떤 자리에 올랐는가보다,<br>그 자리에서 무엇을<br>바꾸었는가.”</p><div class="divider"></div><p class="small muted">민의 v0.3 · 실제 제도를 참고한 가상 정치 인생</p></section></aside></div>`;}
function render(){save();const current=tabs.find(t=>t[0]===tab),headings={home:['나의 집무실','이기려는 마음과 지키려는 약속이 만나는 곳.'],elections:['선거와 도전','어디서 시작하고, 어디까지 나아갈 것인가.'],policies:['정책과 공약','말했던 내일을, 살아갈 오늘로 만드세요.'],people:['정당과 인물','정치는 혼자 걷는 길이 아니니까.'],history:['나의 일대기','당신의 선택이 남긴 발자취.'],guide:['플레이 가이드','민의의 규칙과, 우리가 생략한 현실들.']};$('#app').innerHTML=`<aside class="sidebar"><button class="brand" data-action="nav" data-value="home" aria-label="민의 집무실로"><div class="brand-mark">民</div><div class="brand-copy"><div class="brand-title">민의</div><div class="brand-sub">나의 정치 일대기</div></div></button><div class="side-label">MY POLITICAL JOURNEY</div><nav class="nav" aria-label="주 메뉴">${tabs.map(([id,label,ic])=>`<button class="nav-item ${tab===id?'active':''}" data-action="nav" data-value="${id}" aria-label="${label}" ${tab===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="side-quote">한 사람의 선택이<br>모두의 내일이 되는 곳.</div><div class="side-footer"><span>민의 · 民意</span><span>v0.3</span></div></div></aside><div class="main-wrap"><header class="topbar"><span class="mobile-brand">민의</span><div class="breadcrumb">나의 정치 일대기 <span>/</span><b>${current[1]}</b></div><div class="top-actions"><span class="save-status">${icon('cloud')}${saveBlocked?'기존 기록 보호 중':storageOk?'자동 저장됨':'저장 실패 · 파일로 보관하세요'}</span><span class="date-pill">${icon('calendar')}${E.dateLabel(game)}</span><button class="top-avatar" data-action="settings" aria-label="저장과 설정">${esc(game.name.slice(0,1))}</button></div></header><main id="main"><div class="page-heading"><div><div class="eyebrow">CHAPTER ${String(Math.floor(game.tick/4)+1).padStart(2,'0')} · ${game.office?'약속을 실천하는 시간':'변화를 향한 첫걸음'}</div><h1>${headings[tab][0]}</h1><p>${headings[tab][1]}</p></div>${btn(`${icon('plus')} 새로운 인생`,'new','','secondary')}</div>${({home:renderHome,elections:renderElections,policies:renderPolicies,people:renderPeople,history:renderHistory,guide:renderGuide}[tab])()}<footer class="footnote"><span>민의 · 실제 제도를 참고한 가상 시뮬레이션. 수치와 사건은 현실의 예측이 아닙니다.</span><button data-action="nav" data-value="guide">게임 안내 및 출처 ↗</button></footer></main></div>`;}
let returnFocus=null;
function modal(title,body,wide=false){if(!$('#modal').open)returnFocus=document.activeElement;$('#modal').className=wide?'new-game-dialog':'';$('#modal').innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button type="button" class="close-btn" data-action="close" aria-label="닫기">${icon('close')}</button></div><div class="modal-body">${body}</div>`;if(!$('#modal').open)$('#modal').showModal();}
function close(){ $('#modal').close();if(returnFocus?.isConnected)returnFocus.focus?.(); }
function focusElement(selector,ensureVisible=false){const el=$(selector);if(el){el.setAttribute?.('tabindex','-1');el.focus?.({preventScroll:!ensureVisible});}}
function focusControl(action,value){const controls=document.querySelectorAll?.('[data-action]')||[];for(const el of controls)if(el.dataset?.action===action&&el.dataset?.value===value&&!el.disabled){el.focus?.({preventScroll:true});return true;}return false;}
function captureCreator(){if(!creator)return;try{const form=$('#new-form');if(!form)return;const values=Object.fromEntries(new FormData(form));for(const k of ['name','age','gender','party','region','background','difficulty','careerStyle'])if(values[k]!==undefined&&!(creator.mode==='real'&&['name','party','background'].includes(k)))creator[k]=values[k];}catch{}}
function newGameModal(politicianId='',mode='real'){creator={mode,politicianId,name:'김민준',age:'32',gender:'male',party:'ind',region:REGIONS[0],background:'citizen',difficulty:'easy',careerStyle:'field',query:'',partyFilter:'all',limit:24};renderCreator();}
function renderCreator(){const scroll=$('#creator-roster .roster-grid')?.scrollTop||0;const p=PEOPLE.find(p=>personId(p)===creator.politicianId),real=creator.mode==='real';modal('누구의 정치 인생을 살아볼까요?',`<p class="modal-copy">익숙한 정치인의 이름으로 새롭게 시작하거나 나만의 인물을 만드세요. 누구를 선택해도 같은 성장 규칙과 난이도를 적용합니다.</p><div class="start-mode-tabs" role="group" aria-label="시작할 인물 유형"><button type="button" class="${real?'active':''}" data-action="creatorMode" data-value="real" aria-pressed="${real}">실제 정치인 ${PEOPLE.length}명</button><button type="button" class="${!real?'active':''}" data-action="creatorMode" data-value="custom" aria-pressed="${!real}">나만의 인물</button></div><form id="new-form"><input type="hidden" name="politicianId" value="${real?esc(creator.politicianId):''}">${real?`<div class="roster-tools"><div class="field"><label for="creator-search">이름·지역·이력 검색</label><input id="creator-search" type="search" placeholder="플레이하고 싶은 정치인을 검색하세요" value="${esc(creator.query)}" autocomplete="off"></div><div class="field"><label for="creator-party-filter">자료 기준 소속 정당</label><select id="creator-party-filter"><option value="all">모든 정당</option>${PARTIES.map(x=>`<option value="${x.id}" ${creator.partyFilter===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><div id="creator-roster">${peopleCards(creator.query,creator.partyFilter,creator.limit,true)}</div>${p?`<section class="roster-selection card card-pad"><div class="between"><div><span class="eyebrow">YOUR CHARACTER</span><h3>${esc(p.name)} · 선택한 인물</h3><p>${esc(E.party(p.party).name)} · ${esc(p.cohort||'과거 공개 자료')} 기준</p><p class="small muted">${esc(p.role)}${p.region?' · '+esc(p.region):''}</p></div>${icon('check')}</div></section>`:'<p class="mode-note">위 목록에서 한 명을 선택하면 시작할 수 있습니다.</p>'}<p class="mode-note">실제 이력은 참고 정보입니다. 아래 나이·활동 지역·성장은 새로운 가상 커리어 설정이며 실제 인물의 능력을 평가하지 않습니다.</p>`:''}<div class="form-grid">${!real?`<div class="field"><label for="name">이름</label><input id="name" name="name" required maxlength="16" value="${esc(creator.name)}" autocomplete="off"></div><div class="field"><label for="party">시작 정당</label><select id="party" name="party">${PARTIES.map(x=>`<option value="${x.id}" ${creator.party===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`:`<input type="hidden" name="name" value="${esc(p?.name||'')}"><input type="hidden" name="party" value="${esc(p?.party||'ind')}">`}</div><div class="between"><p class="mode-note" id="scenario-summary">이번 가상 커리어: ${esc(creator.age)}세 · ${creator.gender==='female'?'여성':'남성'} 명부 규칙 · ${esc(creator.region)}</p>${btn('설정 바꾸기','editScenario','','ghost tiny')}</div><details class="creator-details" id="creator-details"><summary>상세 설정 · 가상 시작 나이와 활동 지역</summary><div class="form-grid"><div class="field"><label for="age">${real?'가상 커리어 시작 나이':'시작 나이'}</label><input id="age" name="age" type="number" min="18" max="65" required value="${esc(creator.age)}"></div><div class="field"><label for="gender">${real?'가상 비례명부 성별 설정':'캐릭터 성별 · 비례명부 규칙'}</label><select id="gender" name="gender"><option value="male" ${creator.gender==='male'?'selected':''}>남성 명부 규칙</option><option value="female" ${creator.gender==='female'?'selected':''}>여성 명부 규칙</option></select></div><div class="field wide"><label for="region">${real?'이번 시나리오의 활동 지역':'활동 지역'}</label><select name="region" id="region">${REGIONS.map(r=>`<option ${creator.region===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>${!real?`<div class="field wide"><label>어떤 삶을 살아왔나요?</label><div class="background-options">${BACKGROUNDS.map(b=>`<label class="background-option"><input type="radio" name="background" value="${b.id}" ${creator.background===b.id?'checked':''}><span>${b.name}<small>${b.desc}</small></span></label>`).join('')}</div></div>`:'<input type="hidden" name="background" value="citizen">'}</div></details><div class="form-grid"><fieldset class="field wide creator-fieldset"><legend>플레이 난이도</legend><div class="difficulty-options">${[{id:'easy',name:'쉬움 · 추천',desc:'넉넉한 회복 · 첫 도전 지원'},{id:'standard',name:'보통',desc:'빠듯한 여건 · 더 큰 선택의 부담'}].map(d=>`<label class="option-card"><input type="radio" name="difficulty" value="${d.id}" ${creator.difficulty===d.id?'checked':''}><span><strong>${d.name}</strong><small>${d.desc}</small></span></label>`).join('')}</div></fieldset><fieldset class="field wide creator-fieldset"><legend>이번에는 어떤 스타일로 시작할까요?</legend><div class="career-options">${CAREER_STYLES.map(c=>`<label class="option-card"><input type="radio" name="careerStyle" value="${c.id}" ${creator.careerStyle===c.id?'checked':''}><span><strong>${c.name}</strong><small>${c.desc}</small></span></label>`).join('')}</div><p class="inline-help">게임에서 선택하는 출발 스타일입니다. 이후 어떤 능력이든 성장시킬 수 있습니다.</p></fieldset></div>${game.tick>0?`<section class="roster-selection card card-pad"><span class="eyebrow">이전 인생의 발자취</span><h3>${esc(game.name)} · ${esc(E.identityProfile?.(game)?.title||'나를 알아가는 중')}</h3><p class="small muted">${game.results.filter(r=>r.won).length}번의 당선 · ${game.completed.length}개의 정책 성과 · ${game.logs.length}개의 기록</p></section>`:''}<p class="small muted" style="margin-top:18px">새로 시작하면 현재 기록을 대체하고, 이전 인생 요약을 최근 5개까지 남깁니다. 전체 기록을 보관하려면 먼저 파일로 내보내세요.</p><div class="modal-actions">${btn('현재 기록 저장','export','','secondary')}<button class="btn" type="submit" ${real&&!p?'disabled':''}>${real&&p?esc(p.name)+'으로 시작':'나의 첫걸음'} ${icon('arrow')}</button></div></form>`,true);const roster=$('#creator-roster .roster-grid');if(roster)roster.scrollTop=scroll;}
function updateScenarioSummary(){if(!creator)return;captureCreator();const summary=$('#scenario-summary');if(summary)summary.textContent=`이번 가상 커리어: ${creator.age}세 · ${creator.gender==='female'?'여성':'남성'} 명부 규칙 · ${creator.region}`;}
function refreshCreatorRoster(){const container=$('#creator-roster');if(container&&creator)container.innerHTML=peopleCards(creator.query,creator.partyFilter,creator.limit,true);}
function refreshPeopleRoster(){const container=$('#people-roster');if(container)container.innerHTML=peopleCards(peopleQuery,peopleParty,peopleLimit);}
function settings(){modal('기록과 이어하기',`<p class="modal-copy">${esc(game.name)} · ${E.dateLabel(game)}<br>${saveBlocked?esc(loadMessage):`현재 기록은 이 브라우저에 ${storageOk?'자동 저장됩니다.':'저장되지 않았습니다. 파일로 보관해 주세요.'}`}</p><fieldset class="creator-fieldset"><legend>플레이 난이도</legend><p class="small muted">진행 중에도 바꿀 수 있습니다. 이번 분기의 직접 개입 기록은 그대로 유지합니다.</p><div class="difficulty-options">${btn('쉬움 · 여유로운 성장','difficulty','easy',game.difficulty==='easy'?'':'secondary')}${btn('보통 · 자원과 선택의 균형','difficulty','standard',game.difficulty==='standard'?'':'secondary')}</div></fieldset><div class="stack" style="margin-top:20px">${saveBlocked?btn('읽지 못한 원본 기록 내보내기','exportOriginal','','secondary full'):''}${btn(`${icon('download')} 현재 게임 저장 파일 내보내기`,'export','','secondary full')}${btn(`${icon('upload')} 저장 파일 불러오기`,'import','','secondary full')}${btn('새로운 인생 시작','new','','full')}</div><p class="small muted" style="margin-top:20px">민의 v0.3 · 파일에는 캐릭터 설정과 플레이 기록이 포함됩니다.</p>`);}
function showResult(r){modal('유권자의 선택',`<div class="result-head"><span class="eyebrow">${shortDate(r.tick)} · FICTIONAL ELECTION</span><div class="result-stamp">${r.won?'당선되었습니다.':'도전은 계속됩니다.'}</div><p>${esc(r.name)} ${r.by?'재보궐선거':''}</p></div>${r.rows.map(row=>`<div class="result-row"><div class="between"><span>${row.player?'<b>':''}${esc(row.name)}${row.player?'</b>':''}${row.partyLabel?`<small class="muted"> · ${esc(row.partyLabel)} (게임 소속)</small>`:''}</span><span>${row.percent.toFixed(1)}%${row.seats!==undefined?` · ${row.seats}석`:''}</span></div><div class="result-bar"><span style="width:${row.percent}%;background:${row.color}"></span></div></div>`).join('')}${r.finance?`<section class="campaign-budget"><h3>선거 자금 정산 예정</h3><div class="budget-row"><span>지출한 총액</span><strong>${won(r.finance.total)}</strong></div><div class="budget-row"><span>기탁금 반환 예정</span><strong>${won(r.finance.depositRefund)}</strong></div><div class="budget-row"><span>인정 선거비용 보전 예정</span><strong>${won(r.finance.expenseRefund)}</strong></div>${r.finance.donationRefund?`<div class="budget-row"><span>후원금 부담분 귀속 정리 예정</span><strong>${won(r.finance.donationRefund)}</strong></div>`:''}<p class="budget-note">${r.finance.payer==='party'?'정당 회계로 정산되며 개인 잔액에는 더하지 않습니다.':'개인이 부담한 비율만 선거 계좌에 돌아오며, 정당 부담분은 정당 회계로, 후원금 부담분은 별도 귀속 정리하며 다음 선거에 재사용하지 않습니다.'} 준비비는 보전하지 않습니다.</p></section>`:''}<div class="result-why">${esc(r.reason)}<br><br>게임 결과입니다. 실제 출마·공천·여론조사와 관계가 없습니다.</div><div class="modal-actions">${btn(r.won?'약속을 실천하러 가기':'나의 선택을 돌아보기','afterResult',r.won?'policies':'home')}</div>`);}
function doResult(r,focusSelector=''){if(r.error){toast(r.error,true);return;}const active=document.activeElement?.dataset,origin=active?.action?{action:active.action,value:active.value||''}:null;render();if(r.result){showResult(r.result);return;}toast(r.notices?.length?r.notices.join(' '):r.title||'기록했습니다.');if(focusSelector)focusElement(focusSelector,focusSelector.includes('outcome-card'));else if(!origin||!focusControl(origin.action,origin.value))focusElement('#main h1');}
function downloadSave(text,name){const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('저장 파일을 내보냈습니다.');}
function showPerson(id){const p=PEOPLE.find(p=>personId(p)===id||p.name===id);if(!p)return;modal(esc(p.name),`<div class="flex" style="margin-bottom:20px">${badge(esc(E.party(p.party).name))}<span class="small muted">${esc(p.cohort||'과거 자료')} 기준</span></div><p class="modal-copy"><strong>${esc(p.role)}</strong><br>${esc(p.region||'')}<br>${esc(p.note||'공개된 과거 이력을 참고한 실존 인물입니다. 게임 속 행보와 성장은 새로운 가상 시나리오입니다.')}</p>${p.source&&/^https?:\/\//.test(p.source)?`<a class="text-btn" href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">공개 이력 출처 ↗</a>`:''}<div class="divider"></div><p class="small muted">가상 정책 포럼에 함께 참여할 수 있습니다. 실제 만남이나 발언을 재현하지 않으며 모든 인물에게 같은 성장 규칙을 적용합니다.</p><p class="inline-help">이번 분기의 직접 개입 기회를 씁니다. 협력의 접점을 찾는 동안 다른 현장 일정은 뒤로 미뤄집니다.</p><div class="modal-actions">${btn('가상 포럼 참여','meet',personId(p),'secondary')}${btn('이 인물로 새 인생 시작','playPerson',personId(p))}</div>`);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const {action,value}=el.dataset;switch(action){
case'nav':if(tabs.some(t=>t[0]===value)){tab=value;render();window.scrollTo({top:0});focusElement('#main h1');}break;
case'choose':doResult(E.choose(game,Number(value)),'.outcome-card h3');break;
case'activity':doResult(E.act(game,value),'.outcome-card h3');break;
case'agenda':{const r=E.setAgenda(game,value);doResult(r);if(!r.error){const panel=$('.agenda-panel');if(panel)panel.open=true;focusControl('agenda',value);}break;}
case'advance':doResult(E.advance(game));window.scrollTo({top:0,behavior:'smooth'});break;
case'filter':filter=value;render();focusControl('filter',value);break;
case'declare':{const o=E.office(value),err=E.eligibility(game,o);if(err){toast(err,true);break;}const q=E.campaignQuote?.(game,value);modal(`${o.name}에 도전합니다.`,`<p class="modal-copy">${esc(o.desc)}<br><br>공천은 정당에서 선거에 나갈 후보를 고르는 절차입니다. 정당 소속이면 선거 분기 종료 시 심사를 거칩니다. ${game.office&&game.office.id!==o.id?'공천을 통과하면 현재 직위를 사임하며, 낙선해도 복귀하지 않습니다.':''}</p>${q?`<section class="campaign-budget"><div class="budget-row"><span>기탁금</span><strong>${won(q.deposit)}</strong></div><div class="budget-row"><span>등록에 필요한 선거 자금</span><strong>${won(q.requiredCash??(q.payer==='party'?0:q.total))}</strong></div><div class="budget-row"><span>이번 선거 사용 가능액</span><strong>${won(q.cash)}</strong></div><div class="budget-row"><span>선거 계좌 잔액</span><strong>${won(game.money.campaignCash)}</strong></div><div class="budget-row"><span>이 선거 한정 정당 지원</span><strong>${won(q.grant)}</strong></div><div class="budget-row"><span>부족액</span><strong>${won(q.shortfall)}</strong></div><p class="budget-note">${q.payer==='party'?'이 선거는 정당 회계로 진행합니다. 정당의 비용 전액 지원은 게임 가정입니다.':'공천을 통과한 뒤 후보 등록 시 비용을 지출합니다.'} 선거 후 보전금은 등록할 때 쓸 수 있는 돈이 아닙니다.</p>${q.shortfall?'<p class="budget-note">출마를 선언한 뒤 선거 전에 자금을 더 마련하거나 규모를 줄여야 합니다.</p>':''}</section>`:''}${E.firstElectionSupport?.(game,o)?'<div class="notice">쉬움에서는 첫 기초의회 지역구 도전의 공천을 지원합니다. 본선 결과는 플레이 선택과 모의 투표로 정해집니다.</div>':''}<div class="modal-actions">${btn('돌아가기','close','','secondary')}${btn('출마 선언하기','confirmDeclare',value)}</div>`);break;}
case'campaignPlan':doResult(E.setCampaignPlan(game,value));break;
case'contribute':doResult(E.contributeMoney(game,Number(value)));break;
case'fundraise':doResult(E.fundraise(game));break;
case'partySupport':doResult(E.requestPartySupport(game));break;
case'confirmDeclare':close();doResult(E.declare(game,value));break;
case'by':doResult(E.declare(game,value,true));break;
case'cancelTarget':doResult(E.cancelTarget(game));break;
case'party':modal('함께 걸을 길을 바꿉니다.',`<p class="modal-copy">${esc(E.party(value).name)}으로 활동합니다. 이번 분기의 직접 개입 기회를 사용합니다. 기존 조직과 신뢰에 부담이 생기고, 준비 중인 출마 계획이 해제됩니다.</p><div class="modal-actions">${btn('돌아가기','close','','secondary')}${btn('선택하기','confirmParty',value)}</div>`);break;
case'confirmParty':{const r=E.switchParty(game,value);if(!r.error)close();doResult(r);break;}
case'pledge':doResult(E.pledge(game,value));break;
case'project':doResult(E.startProject(game,value));break;
case'person':showPerson(value);break;
case'meet':{const r=E.meet(game,value);if(!r.error)close();doResult(r);break;}
case'retire':modal('이 정치 인생을 여기까지 회고할까요?',`<p class="modal-copy">지금까지의 선택과 성과는 그대로 남고, 이번 인생의 진행을 마칩니다. 종료 후에는 다른 인물이나 다른 선택으로 새롭게 시작할 수 있습니다.<br><br>계속 플레이하고 싶다면 돌아가기를 선택하세요.</p><div class="modal-actions">${btn('계속 플레이','close','','secondary')}${btn('여기까지 회고 마치기','confirmRetire')}</div>`);break;
case'confirmRetire':{const r=E.retire(game);if(r.error){toast(r.error,true);break;}close();tab='history';doResult(r,'#main h1');window.scrollTo({top:0});break;}
case'new':newGameModal();break;
case'newCustom':newGameModal('','custom');break;
case'playPerson':newGameModal(value);break;
case'editScenario':$('#creator-details').open=true;break;
case'creatorMode':captureCreator();creator.mode=value==='custom'?'custom':'real';renderCreator();focusControl('creatorMode',creator.mode);break;
case'selectPolitician':captureCreator();if(PEOPLE.some(p=>personId(p)===value)){creator.politicianId=value;renderCreator();focusControl('selectPolitician',value);}break;
case'rosterMore':creator.limit+=24;refreshCreatorRoster();break;
case'peopleMore':peopleLimit+=24;refreshPeopleRoster();break;
case'clearCreatorSearch':creator.query='';creator.partyFilter='all';creator.limit=24;$('#creator-search').value='';$('#creator-party-filter').value='all';refreshCreatorRoster();break;
case'clearPeopleSearch':peopleQuery='';peopleParty='all';peopleLimit=24;$('#people-search').value='';$('#people-party-filter').value='all';refreshPeopleRoster();break;
case'difficulty':{const r=E.setDifficulty(game,value);if(!r.error)close();doResult(r);break;}
case'settings':settings();break;
case'close':close();break;
case'afterResult':close();tab=value;render();window.scrollTo({top:0});focusElement('#main h1');break;
case'result':if(game.results[Number(value)])showResult(game.results[Number(value)]);break;
case'export':downloadSave(JSON.stringify(game,null,2),`minui-save-${E.date(game).year}-q${E.date(game).quarter}.json`);break;
case'exportOriginal':if(originalSave)downloadSave(originalSave,'minui-original-save-backup.json');break;
case'import':$('#import-file').click();break;
}});
document.addEventListener('input',e=>{if(creator&&e.target.id==='age')updateScenarioSummary();if(e.target.id==='creator-search'&&creator){creator.query=e.target.value;creator.limit=24;refreshCreatorRoster();}else if(e.target.id==='people-search'){peopleQuery=e.target.value;peopleLimit=24;refreshPeopleRoster();}});
document.addEventListener('change',e=>{if(creator&&['gender','region'].includes(e.target.id))updateScenarioSummary();if(e.target.id==='creator-party-filter'&&creator){creator.partyFilter=e.target.value;creator.limit=24;refreshCreatorRoster();}else if(e.target.id==='people-party-filter'){peopleParty=e.target.value;peopleLimit=24;refreshPeopleRoster();}});
document.addEventListener('invalid',e=>{if(!$('#modal').open||e.target.closest?.('#new-form')?.id!=='new-form')return;const details=$('#creator-details');if(details)details.open=true;e.target.focus?.();},true);
document.addEventListener('submit',e=>{if(e.target.id!=='new-form')return;e.preventDefault();captureCreator();const data=Object.fromEntries(new FormData(e.target));if(creator?.mode==='real'){const p=PEOPLE.find(p=>personId(p)===creator.politicianId);if(!p){toast('먼저 플레이할 인물을 선택해 주세요.',true);return;}data.politicianId=personId(p);data.name=p.name;data.party=p.party;}else{data.politicianId='';if(!String(data.name||'').trim()){toast('이름을 입력해 주세요.',true);return;}}const archived=archiveCareer();game=E.createGame(data);saveBlocked=false;loadMessage='';tab='home';close();render();window.scrollTo({top:0});focusElement('#main h1');toast(archived?`${game.name}의 새로운 정치 인생이 시작되었습니다.`:`새 인생을 시작했습니다. 이전 요약은 저장하지 못해 현재 화면에서만 보관합니다.`,!archived);});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>1000000)throw Error();const data=E.migrateSave(JSON.parse(await f.text()));if(!data)throw Error();modal('이 기록을 이어할까요?',`<p class="modal-copy">${esc(data.name)} · ${E.dateLabel(data)}<br>불러오면 현재 브라우저의 기록을 대체합니다.</p><div class="modal-actions">${btn('취소','close','','secondary')}<button type="button" class="btn" id="confirm-import">이 기록 이어하기</button></div>`);$('#confirm-import').onclick=()=>{game=data;saveBlocked=false;loadMessage='';tab='home';close();render();window.scrollTo({top:0});toast('기록을 불러왔습니다.');};}catch{toast('올바른 민의 저장 파일이 아닙니다. 현재 기록은 유지했습니다.',true);}e.target.value='';});
render();

})();</script></body>
</html>
